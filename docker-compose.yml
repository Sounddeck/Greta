version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: greta-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: greta_pai
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - greta-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/greta_pai --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greta-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB Configuration
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: greta_pai
      
      # API Keys (load from .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      
      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # Application Configuration
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost,http://localhost:80,http://frontend
      
      # AutoGen Studio
      AUTOGEN_STUDIO_VERSION: 0.4.2.2
      
    volumes:
      # Mount code for development (comment out for production)
      - ./backend:/app
      # Persistent data
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_memory:/app/memory
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - greta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./cpas4-ui
      dockerfile: Dockerfile
    container_name: greta-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    networks:
      - greta-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  greta-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_logs:
    driver: local
  backend_data:
    driver: local
  backend_memory:
    driver: local

